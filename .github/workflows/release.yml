name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v0.1.4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag '$TAG' - expected format vMAJOR.MINOR.PATCH (e.g. v0.1.4)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve modules
        run: go mod tidy

      - name: Download modules
        run: go mod download

      - name: Build matrix
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${TAG}"

          build() {
            local goos="$1" goarch="$2" goarm="${3:-}" ext="${4:-}"
            local name="stacktunnel-${goos}-${goarch}${goarm:+v$goarm}"
            local out="dist/${name}${ext}"
            echo "Building ${out}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
              go build -trimpath -ldflags="$LDFLAGS" -o "$out" .
          }

          build linux   amd64
          build linux   arm64
          build linux   arm   7
          build android arm64
          build darwin  amd64
          build darwin  arm64
          build windows amd64 "" .exe
          build windows arm64 "" .exe
          build freebsd amd64

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
