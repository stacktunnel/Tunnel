# Builds binaries for several operating systems and publishes them as a GitHub Release.
#
# Two ways to run it (no extra secrets needed, it uses the built-in GITHUB_TOKEN):
#   1) git tag v0.1.0 && git push origin v0.1.0
#   2) GitHub web UI: Actions -> release -> "Run workflow" -> enter the tag, e.g. v0.1.0
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check tag format
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "releasing $TAG" ;;
            *) echo "Tag must look like v0.1.0, got: $TAG"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Ensure go.mod exists
        run: |
          if [ ! -f go.mod ]; then
            go mod init stacktunnel
            go get github.com/hashicorp/yamux@v0.1.1 golang.org/x/crypto@v0.17.0
          fi
          go mod tidy

      - name: Test before release
        run: |
          go test -race ./...
          go vet ./...
          bash -n setup.sh

      - name: Build all targets
        run: |
          mkdir dist
          # GOOS GOARCH GOARM OUTPUT-NAME
          targets=(
            "linux   amd64 -  stacktunnel-linux-amd64"
            "linux   arm64 -  stacktunnel-linux-arm64"
            "linux   arm   7  stacktunnel-linux-armv7"
            "android arm64 -  stacktunnel-android-arm64"
            "darwin  amd64 -  stacktunnel-darwin-amd64"
            "darwin  arm64 -  stacktunnel-darwin-arm64"
            "windows amd64 -  stacktunnel-windows-amd64.exe"
            "windows arm64 -  stacktunnel-windows-arm64.exe"
            "freebsd amd64 -  stacktunnel-freebsd-amd64"
          )
          for t in "${targets[@]}"; do
            read -r os arch arm out <<<"$t"
            [ "$arm" = "-" ] && arm=""
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM="$arm" \
              go build -trimpath -ldflags="-s -w -X main.version=$TAG" -o "dist/$out" .
          done
          cd dist
          sha256sum stacktunnel-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
